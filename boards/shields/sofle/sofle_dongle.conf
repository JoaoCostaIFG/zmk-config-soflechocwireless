# 2 halves keyboard
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# 4 profiles (n+2)
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

# display dongle options
CONFIG_ZMK_DISPLAY=y
CONFIG_BT_BAS=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# power options
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=n
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# for stability in 128x32 display
#CONFIG_LV_Z_VDB_SIZE=32

# These don't fit in 128x32 display
#CONFIG_ZMK_DONGLE_DISPLAY_BONGO_CAT=n
#CONFIG_ZMK_DONGLE_DISPLAY_MODIFIERS=n
#CONFIG_ZMK_DONGLE_DISPLAY_LAYER=n
